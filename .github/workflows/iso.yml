name: Build and test ISO

on:
  push:
    branches: [main]
    paths:
      - 'asterinas/**'
      - '.github/workflows/iso.yml'
      - 'tools/ci/**'
  pull_request:
    paths:
      - 'asterinas/**'
      - '.github/workflows/iso.yml'
      - 'tools/ci/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: iso-${{ github.ref }}
  cancel-in-progress: true

jobs:
  iso:
    name: Standard runner / full ISO / USB / install / Asterinas
    # Never run untrusted fork code inside the privileged build environment.
    if: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
    runs-on: ubuntu-24.04
    # Entire build/test loop stays below the hosted 360-minute cap.
    timeout-minutes: 350
    env:
      # Builder host only; the ISO and installed OS remain Asterinas NixOS.
      BUILD_IMAGE: ubuntu@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac
      # Workload allowance is measured after narrowly scoped ephemeral cleanup.
      ISO_DISK_RESERVE_BYTES: '1073741824'
    steps:
      - uses: actions/checkout@v4
        timeout-minutes: 5
        with:
          persist-credentials: false

      - name: Lightweight static regression tests
        timeout-minutes: 2
        run: |
          bash -n tools/ci/test-iso.sh tools/ci/verify-iso.sh tools/ci/setup-iso-builder.sh tools/ci/prepare-iso-runner.sh
          bash -n asterinas/tools/nixos/run.sh asterinas/tools/nixos/build_nixos.sh asterinas/tools/qemu_args.sh
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v

      - name: Reclaim unused ephemeral SDKs, measure capacity and select KVM or TCG
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts output
          sudo --preserve-env=GITHUB_ACTIONS,RUNNER_ENVIRONMENT,RUNNER_OS,GITHUB_WORKSPACE \
            bash tools/ci/prepare-iso-runner.sh 2>&1 | tee artifacts/runner-preparation.log
          docker_root=$(docker info --format '{{.DockerRootDir}}')
          checkout_bytes=$(du -s -B1 "$GITHUB_WORKSPACE" | cut -f1)
          # Include Docker's compressed layers and writable layer, not just /work.
          sudo python3 tools/ci/disk_budget.py init artifacts/disk-budget.json \
            --path "$GITHUB_WORKSPACE" --docker-root "$docker_root" \
            --initial-bytes "$checkout_bytes" \
            --limit-from-available-space \
            --reserve-bytes "$ISO_DISK_RESERVE_BYTES"
          # Missing/inaccessible /dev/kvm is normal: select explicit software TCG.
          vm_exports=$(python3 tools/ci/vm_settings.py shell --record artifacts/acceleration.json)
          eval "$vm_exports"
          printf 'ENABLE_KVM=%s\nQEMU_ACCEL=%s\n' "$ENABLE_KVM" "$QEMU_ACCEL" >> "$GITHUB_ENV"
          printf 'QEMU acceleration: %s\n' "$QEMU_ACCEL" | tee artifacts/acceleration.log
          df -h . | tee artifacts/disk-start.log

      - name: Prepare lean pinned builder within budget
        timeout-minutes: 30
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker pull --platform linux/amd64 "$BUILD_IMAGE" 2>&1 | tee artifacts/pull.log
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker run --detach --name iso-builder --privileged \
            --platform linux/amd64 --volume /dev:/dev \
            --volume "$GITHUB_WORKSPACE:/work" --workdir /work/asterinas \
            --env ENABLE_KVM="$ENABLE_KVM" --env QEMU_ACCEL="$QEMU_ACCEL" \
            --env ISO_CI_BUILDER=1 --env NIX_REMOTE=local \
            --env PATH=/root/.cargo/bin:/opt/iso-bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin \
            --env VDSO_LIBRARY_DIR=/opt/linux_vdso \
            --env MEM=4G --env SMP=2 \
            --env QEMU_DISPLAY=none --env CARGO_BUILD_JOBS=2 \
            --env CARGO_INCREMENTAL=0 --env CARGO_PROFILE_DEV_DEBUG=0 \
            --env CARGO_PROFILE_RELEASE_DEBUG=0 \
            --env NIX_CONFIG=$'max-jobs = 1\ncores = 2' \
            --entrypoint /bin/bash "$BUILD_IMAGE" -c 'exec sleep infinity'
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec iso-builder bash /work/tools/ci/setup-iso-builder.sh \
            2>&1 | tee artifacts/setup-builder.log
          docker image inspect "$BUILD_IMAGE" --format 'Image unpacked bytes: {{.Size}}' \
            | tee artifacts/image-size.log
          python3 tools/ci/disk_budget.py check artifacts/disk-budget.json

      - name: Build the full interactive installer (not a test-only image)
        timeout-minutes: 75
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec iso-builder bash -lc \
            'set -euo pipefail; make iso AUTO_INSTALL=false' 2>&1 | tee artifacts/build.log
          touch artifacts/iso-built

      - name: Verify hybrid boot metadata, GRUB and full installer payload
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec iso-builder bash /work/tools/ci/verify-iso.sh \
            2>&1 | tee artifacts/verify.log
          touch artifacts/verify.passed

      - name: Boot the identical ISO as UEFI USB and test the Linux live installer
        timeout-minutes: 35
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec -i iso-builder bash /work/tools/ci/test-iso.sh live-usb \
            2>&1 | tee artifacts/live-usb.log
          touch artifacts/live-usb.passed

      - name: Boot ISO as UEFI CD, install and verify installed EFI GRUB
        timeout-minutes: 100
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec -i iso-builder bash /work/tools/ci/test-iso.sh install \
            2>&1 | tee artifacts/install.log
          touch artifacts/install.passed

      - name: Boot the installed Asterinas kernel and test hello userspace
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker exec -i iso-builder bash /work/tools/ci/test-iso.sh boot \
            2>&1 | tee artifacts/boot.log
          touch artifacts/boot.passed

      - name: Export ISO to output only after VM work (also on test failure)
        if: ${{ !cancelled() && hashFiles('artifacts/iso-built') != '' }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          # Copy once at the end, not alongside the peak install/build footprint.
          # Container Nix-store links cannot be dereferenced on the host.
          iso=$(docker exec iso-builder bash -lc \
            'set -euo pipefail; mapfile -t images < <(find -L target/nixos/iso_image/iso -maxdepth 1 -type f -name "*.iso"); [[ ${#images[@]} -eq 1 ]]; realpath "${images[0]}"')
          python3 tools/ci/disk_budget.py run artifacts/disk-budget.json -- \
            docker cp "iso-builder:$iso" output/cybermanju-asterinas-x86_64.iso \
            2>&1 | tee artifacts/export.log
          test -s output/cybermanju-asterinas-x86_64.iso
          (cd output && sha256sum cybermanju-asterinas-x86_64.iso > SHA256SUMS)
          printf '%s\n' "$GITHUB_SHA" > output/source-commit.txt
          python3 tools/ci/disk_budget.py check artifacts/disk-budget.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          gates = {name: Path(f'artifacts/{name}.passed').exists()
                   for name in ('verify', 'live-usb', 'install', 'boot')}
          acceleration = {path.stem: json.loads(path.read_text())
                          for path in Path('artifacts').glob('acceleration*.json')}
          Path('output/validation.json').write_text(json.dumps({
              'source_commit': os.environ['GITHUB_SHA'], 'gates': gates,
              'accepted': all(gates.values()),
              'acceleration': acceleration,
              'live_environment': 'Linux NixOS full interactive Asterinas installer',
              'installed_target': 'Asterinas NixOS, base configuration with hello-asterinas and gitMinimal',
              'limits': 'Online installation; no integrated desktop, GPU, physical USB or Secure Boot certification; BIOS metadata only',
          }, indent=2) + '\n')
          PY

      - name: Publish full ISO and explicit validation status
        if: ${{ !cancelled() && hashFiles('output/validation.json') != '' }}
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: asterinas-iso-${{ github.sha }}
          path: output/
          compression-level: 0
          retention-days: 7
          if-no-files-found: error

      - name: Collect diagnostics without pruning build or user files
        if: always()
        timeout-minutes: 3
        shell: bash
        run: |
          mkdir -p artifacts
          sudo find asterinas -maxdepth 1 -name 'qemu*.log' -type f -exec cp {} artifacts/ \; || true
          sudo chmod -R a+rX artifacts output
          df -h . > artifacts/disk-final.log
          docker stop --time 10 iso-builder || true

      - name: Publish build, disk and VM diagnostics
        if: always()
        timeout-minutes: 5
        uses: actions/upload-artifact@v4
        with:
          name: iso-test-logs-${{ github.sha }}
          path: artifacts/
          retention-days: 7
          if-no-files-found: warn

      - name: Record honest acceptance result
        if: always()
        timeout-minutes: 1
        env:
          JOB_STATUS: ${{ job.status }}
        run: |
          {
            echo '## Full Asterinas installer ISO — standard-runner attempt'
            echo "Commit: \`$GITHUB_SHA\`; job status: **$JOB_STATUS**"
            echo "Preflight QEMU acceleration: **${QEMU_ACCEL:-not selected}**; phase-specific choices are in validation.json and logs."
            echo 'KVM only when the device is available and accessible; otherwise explicit TCG software emulation.'
            echo 'TCG-sized step budgets: build 75m, live USB 35m, install 100m, installed boot 60m; job 350m (<360m hosted maximum).'
            echo 'Only a successful job establishes fit and all configured VM gates.'
            echo 'Standard hosted runner; only unused host .NET, Android and Haskell SDK directories reclaimed. No local/self-hosted cleanup or larger-runner fallback.'
            echo 'Measured post-cleanup free bytes plus initial checkout bytes set the soft cap, including Docker; 1 GiB stays reserved.'
            echo 'Sparse guest capacity is not host disk consumption. Budget polling is not a hard filesystem quota.'
            echo 'Gates: <=4 GiB full ISO; BIOS/UEFI hybrid metadata; EFI GRUB; UEFI USB live Linux installer; UEFI CD install; installed GRUB; installed Asterinas hello test.'
            echo 'BIOS execution, physical USB hardware, offline installation, Secure Boot and an integrated GPUI/CyberManju desktop are NOT certified.'
            echo 'A retained ISO from a failed job is UNACCEPTED; read validation.json and logs.'
          } >> "$GITHUB_STEP_SUMMARY"
