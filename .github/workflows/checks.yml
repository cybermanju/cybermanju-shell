name: Shell regression checks

on:
  push:
    branches: [main]
    paths:
      - 'asterinas/kernel/core/comps/framebuffer/**'
      - 'asterinas/kernel/libs/linux-module-staging/**'
      - 'asterinas/osdk/**'
      - 'asterinas/Cargo.toml'
      - 'asterinas/Cargo.lock'
      - 'asterinas/rust-toolchain.toml'
      - 'tools/ci/**'
      - 'asterinas/kernel/libs/linux-module-elf/**'
      - 'asterinas/ostd/**'
      - 'asterinas/tools/nixos/**'
      - 'asterinas/tools/qemu_args.sh'
      - 'asterinas/distro/iso_image/**'
      - 'gpui-shell/scripts/**'
      - '.github/workflows/**'
  pull_request:
    paths:
      - 'asterinas/kernel/core/comps/framebuffer/**'
      - 'asterinas/kernel/libs/linux-module-staging/**'
      - 'asterinas/osdk/**'
      - 'asterinas/Cargo.toml'
      - 'asterinas/Cargo.lock'
      - 'asterinas/rust-toolchain.toml'
      - 'tools/ci/**'
      - 'asterinas/kernel/libs/linux-module-elf/**'
      - 'asterinas/ostd/**'
      - 'asterinas/tools/nixos/**'
      - 'asterinas/tools/qemu_args.sh'
      - 'asterinas/distro/iso_image/**'
      - 'gpui-shell/scripts/**'
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: shell-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    # Safe for fork PRs: no secrets, containers, sudo or privileged VM build.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Shell syntax and ISO regression suite (no VM)
        run: |
          bash -n tools/ci/*.sh asterinas/tools/nixos/run.sh asterinas/tools/nixos/build_nixos.sh asterinas/tools/qemu_args.sh
          python3 -m unittest discover -s tools/ci -p 'test_*.py' -v
      - name: Frame telemetry regressions and presentation script syntax (not an FPS benchmark)
        working-directory: gpui-shell
        run: |
          python3 -m unittest discover -s scripts -p 'test_frame_telemetry.py' -v
          python3 -m py_compile scripts/test_nested_presentation_boundary.py

  linux-module-elf:
    # Host-only parser checks, not evidence of a module loaded in Asterinas.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: ELF structural preflight and real C ET_REL fixture (no kernel boot)
        run: bash tools/ci/test_linux_module_elf.sh

  module-staging:
    # Mock pages test ownership/rollback only, never a physical allocator or MMU.
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Staging ownership and injected allocation/copy failure tests (host only)
        run: bash tools/ci/test_module_staging.sh

  ostd-check:
    # Type-check the real backend, not a boot or runtime frame allocation test.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'nightly-2026-07-21'
          targets: x86_64-unknown-none
          components: rust-src
      - name: Check real OSTD x86-64 adapter with default features (no link or boot)
        working-directory: asterinas
        run: cargo check --locked -p ostd -p linux-module-staging -p aster-framebuffer --target x86_64-unknown-none

  module-staging-runtime:
    # Real OSTD frames in a disposable TCG VM; no .ko execution or host modules.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'nightly-2026-07-21'
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools
      - name: Install tools for the minimal disposable BIOS test VM
        run: sudo bash tools/ci/install_runtime_tools.sh module-staging
      - name: Exercise real frame staging and rollback (one kernel test, seven scenarios)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/linux-module-runtime
      - name: Verify OSTD virtual-address reservation only (one kernel test, six scenarios; no payload mappings)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/module-address-runtime --address-reservation
      - name: Verify near-text foreign-PTE fault injection, not production mapping
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/near-text-collision-runtime --near-text-collision
      - name: Verify signed32 partial mapping rollback and preservation of a foreign PTE
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/signed32-mapping-fault-runtime --signed32-mapping-fault
      - name: Verify module mapping calls are rejected under two-CPU topology (one test, three calls; no mappings)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/module-mapping-smp-rejection --smp-rejection
      - name: Verify local global-TLB invalidation encoding, aggregation and stale readback (one CPU)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/tlb-global-runtime --tlb-global
      - name: Verify remote TLB dispatch acknowledgements (two-CPU q35 TCG; no coherence claim)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/tlb-remote-runtime --tlb-remote
      - name: Verify scoped remote TLB byte readback (two-CPU q35 TCG; no universal coherence claim)
        run: bash tools/ci/test_module_staging_runtime.sh artifacts/tlb-remote-readback-runtime --tlb-remote-readback
      - name: Prepare real no-import .ko inside QEMU and verify all staged bytes (never call init)
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/prepared-module-runtime
      - name: Prepare ELF at near-text base and retain frames without mapping or execution
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/near-text-prepared-runtime --near-text-prepared
      - name: Verify R32S and relative ELF through temporary RW non-executable signed32 mappings
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/signed32-prepared-runtime --signed32-prepared
      - name: Verify signed32 temporary mapping is denied on two CPUs without altering buffers
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/signed32-mapping-smp-runtime --signed32-mapping-smp
      - name: Search bounded signed32 candidates and verify full staged bytes without execution
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/signed32-search-runtime --signed32-search
      - name: Verify fixed OSTD internal exports and complete staged bytes without Linux ABI
        run: bash tools/ci/test_prepared_module_runtime.sh artifacts/internal-exports-runtime --internal-exports
      - name: Retain serial evidence and exact harness dependency resolution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: module-staging-runtime-${{ github.sha }}
          path: |
            artifacts/linux-module-runtime/*.log
            artifacts/linux-module-runtime/*.json
            artifacts/linux-module-runtime/*.txt
            artifacts/linux-module-runtime/harness-Cargo.*
            artifacts/module-address-runtime/*.log
            artifacts/module-address-runtime/*.json
            artifacts/module-address-runtime/*.txt
            artifacts/module-address-runtime/harness-Cargo.*
            artifacts/near-text-collision-runtime/*.log
            artifacts/near-text-collision-runtime/*.json
            artifacts/near-text-collision-runtime/*.txt
            artifacts/near-text-collision-runtime/harness-Cargo.*
            artifacts/signed32-mapping-fault-runtime/*.log
            artifacts/signed32-mapping-fault-runtime/*.json
            artifacts/signed32-mapping-fault-runtime/*.txt
            artifacts/signed32-mapping-fault-runtime/harness-Cargo.*
            artifacts/module-mapping-smp-rejection/*.log
            artifacts/module-mapping-smp-rejection/*.json
            artifacts/module-mapping-smp-rejection/*.txt
            artifacts/module-mapping-smp-rejection/harness-Cargo.*
            artifacts/tlb-global-runtime/*.log
            artifacts/tlb-global-runtime/*.json
            artifacts/tlb-global-runtime/*.txt
            artifacts/tlb-global-runtime/harness-Cargo.*
            artifacts/tlb-remote-runtime/*.log
            artifacts/tlb-remote-runtime/*.json
            artifacts/tlb-remote-runtime/*.txt
            artifacts/tlb-remote-runtime/harness-Cargo.*
            artifacts/tlb-remote-readback-runtime/*.log
            artifacts/tlb-remote-readback-runtime/*.json
            artifacts/tlb-remote-readback-runtime/*.txt
            artifacts/tlb-remote-readback-runtime/harness-Cargo.*
          retention-days: 7
          if-no-files-found: warn

      - name: Retain prepared-module data-only runtime and fixture provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: prepared-module-runtime-${{ github.sha }}
          path: |
            artifacts/prepared-module-runtime/*.log
            artifacts/prepared-module-runtime/*.json
            artifacts/prepared-module-runtime/*.txt
            artifacts/prepared-module-runtime/harness-Cargo.*
            artifacts/prepared-module-runtime/fixture/
            artifacts/near-text-prepared-runtime/*.log
            artifacts/near-text-prepared-runtime/*.json
            artifacts/near-text-prepared-runtime/*.txt
            artifacts/near-text-prepared-runtime/harness-Cargo.*
            artifacts/near-text-prepared-runtime/fixture/
            artifacts/signed32-prepared-runtime/*.log
            artifacts/signed32-prepared-runtime/*.json
            artifacts/signed32-prepared-runtime/*.txt
            artifacts/signed32-prepared-runtime/harness-Cargo.*
            artifacts/signed32-mapping-smp-runtime/*.log
            artifacts/signed32-mapping-smp-runtime/*.json
            artifacts/signed32-mapping-smp-runtime/*.txt
            artifacts/signed32-mapping-smp-runtime/harness-Cargo.*
            artifacts/signed32-prepared-runtime/fixture/
            artifacts/signed32-search-runtime/*.log
            artifacts/signed32-search-runtime/*.json
            artifacts/signed32-search-runtime/*.txt
            artifacts/signed32-search-runtime/harness-Cargo.*
            artifacts/signed32-search-runtime/fixture/
            artifacts/internal-exports-runtime/*.log
            artifacts/internal-exports-runtime/*.json
            artifacts/internal-exports-runtime/*.txt
            artifacts/internal-exports-runtime/harness-Cargo.*
            artifacts/internal-exports-runtime/fixture/
          retention-days: 7
          if-no-files-found: warn

  linux-module-kbuild:
    # A real kbuild .ko is compiled and inspected, NEVER loaded on the runner.
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.97.1'
      - name: Install fixed Linux headers and inspection tools (no kernel image)
        run: sudo bash tools/ci/install_runtime_tools.sh kbuild
      - name: Build and structurally inspect Linux 6.8.0-147-generic fixture
        run: bash tools/ci/test_linux_module_kbuild.sh artifacts/linux-module-kbuild
      - name: Prepare test-only no-import kbuild fixture with zero exports (never execute)
        run: bash tools/ci/test_linux_module_noimports.sh artifacts/linux-module-noimports
      - name: Retain module and provenance without claiming native execution
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-module-kbuild-${{ github.sha }}
          path: artifacts/linux-module-kbuild/
          retention-days: 7
          if-no-files-found: warn
      - name: Retain no-import fixture and its nonstandard test configuration
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-module-noimports-${{ github.sha }}
          path: artifacts/linux-module-noimports/
          retention-days: 7
          if-no-files-found: warn

  framebuffer-runtime:
    # Boot-provided VGA MMIO readback, NOT GPUI, acceleration or physical scanout.
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 'nightly-2026-07-21'
          targets: x86_64-unknown-none
          components: rust-src, llvm-tools
      - name: Install tools for disposable framebuffer VMs
        run: sudo bash tools/ci/install_runtime_tools.sh framebuffer
      - name: Test padded metadata, Multiboot2 conversion and overflow rejection (no GPU I/O)
        run: bash tools/ci/test_framebuffer_runtime.sh artifacts/framebuffer-contract --kind contract
      - name: Read back pixels through the boot framebuffer and real VGA MMIO in QEMU
        run: bash tools/ci/test_framebuffer_runtime.sh artifacts/framebuffer-hardware --kind hardware
      - name: Verify offset framebuffer initialization and real MMIO reacquisition
        run: bash tools/ci/test_framebuffer_runtime.sh artifacts/framebuffer-offset-init --kind offset-init
      - name: Prepare pinned kernel VDSO library for direct fbdev fileops
        run: bash tools/ci/prepare_kernel_vdso.sh artifacts/kernel-vdso
      - name: Exercise direct fbdev fileops in the runtime kernel
        run: VDSO_LIBRARY_DIR="$GITHUB_WORKSPACE/artifacts/kernel-vdso" bash tools/ci/test_framebuffer_runtime.sh artifacts/fbdev-runtime --kind fbdev
      - name: Retain serial, actual image GRUB config and harness provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: framebuffer-runtime-${{ github.sha }}
          path: |
            artifacts/framebuffer-contract/*.log
            artifacts/framebuffer-contract/*.json
            artifacts/framebuffer-contract/*.txt
            artifacts/framebuffer-contract/grub.cfg
            artifacts/framebuffer-contract/harness-Cargo.*
            artifacts/framebuffer-hardware/*.log
            artifacts/framebuffer-hardware/*.json
            artifacts/framebuffer-hardware/*.txt
            artifacts/framebuffer-hardware/grub.cfg
            artifacts/framebuffer-hardware/harness-Cargo.*
            artifacts/framebuffer-offset-init/*.log
            artifacts/framebuffer-offset-init/*.json
            artifacts/framebuffer-offset-init/*.txt
            artifacts/framebuffer-offset-init/grub.cfg
            artifacts/framebuffer-offset-init/harness-Cargo.*
            artifacts/fbdev-runtime/*.log
            artifacts/fbdev-runtime/*.json
            artifacts/fbdev-runtime/*.txt
            artifacts/fbdev-runtime/grub.cfg
            artifacts/fbdev-runtime/harness-Cargo.*
          retention-days: 7
          if-no-files-found: warn
