[package]
name = "cybermanju-crypto"
version = "0.1.1"
edition = "2021"
description = "Post-quantum cryptography engine (ML-KEM, ML-DSA, ChaCha20)"

[dependencies]
anyhow = "1"
base64 = "0.22"
blake3 = "1"
chacha20poly1305 = "0.10"
chrono = { version = "0.4", features = ["serde"] }
hkdf = "0.12"
# Size-prepended lz4 leg of the CYBMJ01 backup container (same 0.11 the
# compression crate frames with, so both sides agree byte-for-byte).
lz4_flex = "0.11"
# hmac stays 0.12: hkdf 0.12 / sha2 0.10 / argon2 0.5 all sit on digest
# 0.10, and hmac 0.13 (digest 0.11) breaks every Hmac<Sha512> use with
# E0277/E0576 (CI 2026-10-11). Do NOT bump without moving the whole tree.
hmac = "0.12"
ml-dsa = { version = "0.1.1", features = ["getrandom"] }
pqcrypto-mlkem = "0.1"
pqcrypto-traits = "0.3"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
signature = "3"
uuid = { version = "1", features = ["v4"] }
x25519-dalek = { version = "2", features = ["static_secrets"] }
# <<< AGENT-3 KEYS AT REST: Argon2id for passphrase-derived keys >>>
argon2 = "0.5"
log = "0.4"
