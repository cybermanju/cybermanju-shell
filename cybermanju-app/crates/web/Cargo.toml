[package]
name = "cybermanju-web"
version = "0.1.1"
edition = "2021"
description = "HTTP REST server with JWT auth and rate limiting"

[dependencies]
anyhow = "1"
argon2 = "0.5"
base64 = "0.22"
blake3 = "1"
chrono = { version = "0.4", features = ["serde"] }
cybermanju-compression = { path = "../compression" }
cybermanju-db = { path = "../db" }
cybermanju-search = { path = "../search" }
cybermanju-sync = { path = "../sync" }
cybermanju-disk = { path = "../disk" }
cybermanju-os = { path = "../os" }
cybermanju-faces = { path = "../faces", default-features = false }
# Pure-Rust decoders only (jpeg/png) — no C, so musl + mobile stays link-safe.
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
cybermanju-types = { path = "../types" }
cybermanju-agent = { path = "../agent", features = ["native"] }
jsonwebtoken = "9"
log = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
redb = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
cybermanju-crypto = { path = "../crypto" }

[dev-dependencies]
tempfile = "3"
