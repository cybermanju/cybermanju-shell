[package]
name = "cybermanju-agent"
version = "0.1.1"
edition = "2021"
description = "Native AI coding-agent core: providers, permissions, tool loop, hash-anchored edits"

[features]
default = []
# Blocking HTTP transport (reqwest). Native targets (Tauri, server) enable
# this; WASM builds the pure core only and fetch in os-wasm instead.
native = ["dep:reqwest"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
blake3 = "1"
# Real rg-style patterns for grep (literal fallback on bad syntax).
# Pure Rust, no OS calls — compiles to wasm32 like the rest of the core.
regex = "1"
cybermanju-types = { path = "../types" }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"], optional = true }
