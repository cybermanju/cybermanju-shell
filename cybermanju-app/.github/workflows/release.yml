name: Release

on:
  push:
    tags:
      - "v*"
  # Manual / push.sh-driven release. Two modes (see the `resolve` job):
  # - full (reuse_run_id empty): rebuild every artifact family for `tag`.
  # - reuse (reuse_run_id set): skip ALL build jobs and ship the dist-*
  #   artifacts of that green CI run unchanged (`push.sh --release --last`
  #   resolves the run id for HEAD and dispatches this workflow).
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (must be v<package.json version>)"
        required: true
        type: string
      reuse_run_id:
        description: "Green CI run id whose dist-* artifacts to ship (skips all rebuilds)"
        required: false
        default: ""
        type: string
      notes:
        description: "Custom release-notes markdown, prepended to docs/RELEASE_NOTES.md"
        required: false
        default: ""
        type: string

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Match ci.yml: CI is always a cold start and rust-cache drops incremental
  # artifacts before saving, so paying for them only buys thrown-away time.
  CARGO_INCREMENTAL: "0"
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  # ─── Resolve: which tag, full rebuild or artifact reuse ────────────
  # Cheap (checkout + version check only, zero compilation) so BOTH modes
  # validate the tag before anything expensive — or anything at all — runs.
  resolve:
    name: Resolve tag & mode
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.t.outputs.tag }}
      reuse_run_id: ${{ steps.t.outputs.reuse_run_id }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Resolve tag and reuse mode
        id: t
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
            REUSE="${{ inputs.reuse_run_id }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
            REUSE=""
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::tag must look like v<X.Y.Z> (got '$TAG')"; exit 1 ;;
          esac
          if [ -n "$REUSE" ]; then
            case "$REUSE" in
              ''|*[!0-9]*) echo "::error::reuse_run_id must be a numeric CI run id (got '$REUSE')"; exit 1 ;;
            esac
            echo "reuse mode: shipping dist-* artifacts of CI run $REUSE, no rebuild"
          else
            echo "full mode: rebuilding everything for $TAG"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "reuse_run_id=$REUSE" >> "$GITHUB_OUTPUT"

      - name: Release tag matches the version everywhere
        run: bash scripts/check-version.sh --tag "${{ steps.t.outputs.tag }}"

  # ─── Rust: Lint & Test (gate) ─────────────────────────────────────
  rust-check:
    name: Rust Lint & Test
    runs-on: ubuntu-latest
    needs: resolve
    # Skipped in reuse mode: the reused CI run already passed these gates
    # on the same tree, and this job compiles the workspace (a rebuild).
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Release tag matches the version everywhere
        run: bash scripts/check-version.sh --tag "${{ needs.resolve.outputs.tag }}"

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # libglib2.0-dev explicit: glib-sys build script needs glib-2.0.pc
          # (tauri → gtk and tauri-plugin-dialog → rfd on Linux).
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          version: "1.1"

      # The cache action pins exact .deb versions yet reports success even
      # when `apt-get install` 404s on a stale mirror index — leaving ZERO
      # system libs installed (CI 2026-10-11: every GTK compile then fails
      # on `glib-2.0.pc not found`). Self-heal with an unpinned reinstall,
      # then prove the .pc files pkg-config actually needs exist.
      - name: Verify system dependencies (repair on mirror 404)
        run: |
          if ! pkg-config --exists 'glib-2.0 >= 2.70'; then
            echo "glib-2.0.pc missing — retrying apt with a fresh index"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          fi
          pkg-config --modversion glib-2.0
          pkg-config --exists 'glib-2.0 >= 2.70'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true
          # Shared with the Linux build jobs (same workspace/targets).
          shared-key: "linux-workspace"

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run tests
        run: cargo test --workspace --no-fail-fast

  # ─── WASM: Build for Web ─────────────────────────────────────────
  wasm-build:
    name: Build WASM (Web)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Mirrors ci.yml: the Rust half must compile for the browser target,
      # and wasm-pack must exist before `npm run build:wasm` calls it.
      # Toolchain + targets come from rust-toolchain.toml (no `rustup target
      # add`); the old `cargo check` duplicate of `wasm-pack build` is gone.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true
          shared-key: "linux-workspace"

      # Prebuilt binary; building wasm-pack from source costs minutes.
      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-pack

      - name: wasm-pack build (assertion)
        run: wasm-pack build crates/os-wasm --target web --out-dir pkg

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx vue-tsc --noEmit

      - name: Frontend unit tests
        run: npm test

      # Keep the freshly built pkg in place so the vite step's alias to
      # crates/os-wasm/pkg resolves to the wasm backend (same as ci.yml).
      # Supabase broker baked from GH Secrets (see useSupabase.ts).
      - name: Build WASM bundle
        run: npm run build:wasm:frontend
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wasm
          path: dist-wasm/
          retention-days: 30
          if-no-files-found: error

  # ─── Windows: Build Desktop ──────────────────────────────────────
  windows-build:
    name: Build Windows
    runs-on: windows-latest
    # No `needs: rust-check`: the build compiles independently and
    # create-release still gates on rust-check — waiting here was pure
    # latency on the release critical path. Same for linux/macos/android
    # below.
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # OAuth broker (public URL + anon key) baked into the bundle so
          # sign-in works out of the box on every device. Empty when unset —
          # the app then takes the Settings → OAuth broker paste.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: |
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/*/*.msi
            target/release/bundle/*/*.exe
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Desktop (deb + AppImage + rpm) ──────────────────
  linux-build:
    name: Build Linux (deb+AppImage+rpm)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install system dependencies
        uses: awalsh128/cache-apt-pkgs-action@553a35bb8ebd9fcabcb1c9451aa4c98e1b4ca8a9 # v1.6.3
        with:
          # libglib2.0-dev explicit: glib-sys build script needs glib-2.0.pc
          # (tauri → gtk and tauri-plugin-dialog → rfd on Linux).
          packages: libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          version: "1.1"

      # The cache action pins exact .deb versions yet reports success even
      # when `apt-get install` 404s on a stale mirror index — leaving ZERO
      # system libs installed (CI 2026-10-11: every GTK compile then fails
      # on `glib-2.0.pc not found`). Self-heal with an unpinned reinstall,
      # then prove the .pc files pkg-config actually needs exist.
      - name: Verify system dependencies (repair on mirror 404)
        run: |
          if ! pkg-config --exists 'glib-2.0 >= 2.70'; then
            echo "glib-2.0.pc missing — retrying apt with a fresh index"
            sudo apt-get update
            sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libglib2.0-dev libayatana-appindicator3-dev librsvg2-dev libsoup-3.0-dev libjavascriptcoregtk-4.1-dev pkg-config build-essential libssl-dev
          fi
          pkg-config --modversion glib-2.0
          pkg-config --exists 'glib-2.0 >= 2.70'

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true
          shared-key: "linux-workspace"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # OAuth broker (public URL + anon key) baked into the bundle —
          # linux artifacts (deb/AppImage/rpm, and the Flatpak repackaged
          # from the deb) sign in out of the box on every device.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/*/*.deb
            target/release/bundle/*/*.AppImage
          retention-days: 30
          if-no-files-found: error

      - name: Upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-deb
          path: target/release/bundle/deb/*.deb
          retention-days: 30
          if-no-files-found: error

      - name: Upload RPM package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: error

      # Folded in from the old standalone `rpm-build` job (download +
      # re-upload of the identical bytes under another name). Both names are
      # still produced so `fetch-last-build` pairs keep working.
      - name: Upload RPM artifacts (release name)
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rpm
          path: target/release/bundle/rpm/*.rpm
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Flatpak ────────────────────────────────────────
  flatpak-build:
    name: Build Linux (Flatpak)
    runs-on: ubuntu-latest
    # Only waits for `release-linux-deb`, not for lint. Matches ci.yml.
    needs: linux-build
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Load-bearing (mirrors ci.yml): the manifest stages the app FROM this
      # deb (type: dir → ../../artifacts) — fail fast instead of letting an
      # empty artifacts/ explode later inside flatpak-builder.
      - name: Download Debian package
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-linux-deb
          path: artifacts

      - name: Install Flatpak
        run: |
          sudo apt-get update
          sudo apt-get install -y flatpak flatpak-builder
          sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo

      - name: Install GNOME runtime and SDK
        run: |
          sudo flatpak install -y --noninteractive flathub org.gnome.Platform//47 org.gnome.Sdk//47

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=repo build-dir src-tauri/flatpak/com.cybermanju.os.yml
          flatpak build-bundle repo cybermanju-os.flatpak com.cybermanju.os

      - name: Upload Flatpak artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak
          path: cybermanju-os.flatpak
          retention-days: 30
          if-no-files-found: error

  # ─── Linux: Build Arch Package ────────────────────────────────────
  arch-build:
    name: Build Linux (Arch/CachyOS)
    runs-on: ubuntu-latest
    # Deliberately waits on nothing: this job runs its own rustup + full
    # build inside an Arch container and downloads no artifacts from any
    # other job, so `needs` here was pure latency. Matches ci.yml
    # (create-release still gates on rust-check + this job).
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    container:
      image: archlinux:latest
    steps:
      - name: Install base dependencies
        run: |
          # Same as ci.yml: retry transient Arch mirror flakes (CI 2026-10-08).
          ok=""
          for i in 1 2 3 4 5; do
            if pacman -Syu --noconfirm; then ok=1; break; fi
            echo "pacman -Syu failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::pacman -Syu failed 5 times"; exit 1; }
          ok=""
          for i in 1 2 3 4 5; do
            if pacman -S --noconfirm \
              base-devel \
              git \
              webkit2gtk-4.1 \
              gtk3 \
              libayatana-appindicator \
              librsvg \
              libsoup3 \
              pkg-config \
              openssl \
              curl \
              sudo \
              xdg-utils \
              rpm-tools \
              fuse2 \
              dpkg \
              patchelf \
              desktop-file-utils; then ok=1; break; fi
            echo "pacman -S failed (attempt $i), retrying in 15s..."
            sleep 15
          done
          [ -n "$ok" ] || { echo "::error::pacman -S failed 5 times"; exit 1; }

      # See ci.yml: linuxdeploy's gtk plugin dies on the loader directory
      # that gdk-pixbuf2 2.44 stopped shipping while its .pc file still
      # advertises it. Recreate it so the AppImage bundle can proceed.
      - name: Restore gdk-pixbuf loader directory
        run: mkdir -p /usr/lib/gdk-pixbuf-2.0/2.10.0/loaders

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Fix ownership
        run: chown -R builder:builder $GITHUB_WORKSPACE

      - name: Install Rust
        run: |
          sudo -u builder bash -c 'curl --proto "=https" --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y'
          sudo -u builder bash -c 'source $HOME/.cargo/env && rustup default stable'

      # rust-cache below runs as root but must see the toolchain (installed
      # as `builder` above) — link it onto the default PATH.
      - name: Link cargo into PATH (for rust-cache)
        run: ln -sf /home/builder/.cargo/bin/cargo /home/builder/.cargo/bin/rustc /usr/local/bin/

      # Without this every run recompiled the whole workspace from zero.
      # HOME override aligns cargo-home paths with the build step below.
      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        env:
          HOME: /home/builder
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Install Node.js
        run: pacman -S --noconfirm nodejs npm

      - name: Cache npm directory
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /home/builder/.npm
          key: npm-arch-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            npm-arch-

      - name: Fix npm cache ownership
        run: chown -R builder:builder /home/builder/.npm 2>/dev/null || true

      # rust-cache above runs as root and restores root-owned files into the
      # workspace and /home/builder/.cargo — the build below runs as
      # `builder` and dies with `Permission denied` unpacking the registry
      # (CI 2026-10-11: `adler2 v2.0.1`). Re-chown right before building.
      - name: Fix cargo and workspace ownership
        run: chown -R builder:builder /home/builder/.cargo "$GITHUB_WORKSPACE"

      # NO_STRIP: linuxdeploy's bundled strip cannot read the .relr.dyn
      # sections Arch-built libraries carry (tauri#8929).
      # APPIMAGE_EXTRACT_AND_RUN: no /dev/fuse in this container.
      - name: Build Arch package
        # OAuth broker secrets ride the step env into the inner sudo shell
        # via the explicit exports below (`sudo` scrubs the environment, so
        # the inner command would otherwise build broker-less). The two
        # unescaped `$VARS` expand in the outer shell on purpose; `\$HOME` /
        # `\$PATH` stay escaped for the inner one.
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          sudo -u builder bash -c "
            export HOME=/home/builder
            export PATH=\$HOME/.cargo/bin:\$PATH
            export NO_STRIP=true
            export APPIMAGE_EXTRACT_AND_RUN=1
            export VITE_SUPABASE_URL=\"$VITE_SUPABASE_URL\"
            export VITE_SUPABASE_ANON_KEY=\"$VITE_SUPABASE_ANON_KEY\"
            cd $GITHUB_WORKSPACE
            npm ci
            npm run tauri build || npm run tauri -- build --verbose
          "

      - name: Collect artifacts
        run: |
          chown -R builder:builder $GITHUB_WORKSPACE
          sudo -u builder bash -c '
            mkdir -p dist-arch
            cp target/release/bundle/deb/*.deb dist-arch/ 2>/dev/null || true
            cp target/release/bundle/appimage/*.AppImage dist-arch/ 2>/dev/null || true
          '

      - name: Upload Arch build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch
          path: dist-arch/
          retention-days: 30
          if-no-files-found: error

  # ─── macOS: Build Desktop (dmg + app) ────────────────────────────
  macos-build:
    name: Build macOS
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri build
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          # OAuth broker (public URL + anon key) baked into the bundle so
          # sign-in works out of the box on every device.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: |
            target/release/bundle/dmg/*.dmg
            target/release/bundle/macos/*.app
            target/release/bundle/*/*.dmg
            target/release/bundle/*/*.app
          retention-days: 30
          if-no-files-found: error

  # ─── Android: Build APK ──────────────────────────────────────────
  android-build:
    name: Build Android
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    env:
      # Pinned to the AGP default (AGP 9.x release notes). The Tauri template
      # sets compileSdk/targetSdk 36 with no ndkVersion, so Gradle demands
      # platform android-36, build-tools 36.0.0 and this exact NDK. Both
      # NDK vars must point here: Tauri reads NDK_HOME for the Rust linker,
      # and without it the runner's newest preinstalled NDK (r29) is used
      # for Rust while Gradle wants this one.
      NDK_VERSION: 28.2.13676358
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Same as ci.yml: ort-sys `download-binaries` extracts outside
      # `target/`, which `rust-cache` never restores — pin + persist it.
      - name: Pin ONNX Runtime download cache
        run: echo "ORT_CACHE_DIR=$HOME/.cache/ort" >> "$GITHUB_ENV"

      - name: Setup Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@be39fa834029ff78f1a44aa3bb0819b8fc2bd8fd # v4.0.4
        with:
          # Passed explicitly (== the v4 default) so upstream default churn
          # can never reintroduce the removed legacy 'tools' package.
          packages: platform-tools

      # Same as ci.yml: the SDK/NDK (~1 GB) and Gradle artifacts (~500 MB)
      # were re-downloaded on every run. sdkmanager skips what's present.
      - name: Cache Android SDK/NDK
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ env.ANDROID_HOME }}
          key: android-sdk-36-ndk-${{ env.NDK_VERSION }}-v1

      - name: Cache Gradle
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('package-lock.json') }}-v1
          restore-keys: |
            gradle-${{ runner.os }}-

      - name: Install Android SDK components
        run: |
          yes | sdkmanager --licenses > /dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "ndk;$NDK_VERSION"

      # Tauri picks the NEWEST NDK under $ANDROID_HOME/ndk even when
      # NDK_HOME/ANDROID_NDK_HOME point at the pinned one — leave exactly
      # one NDK behind so "newest" == "pinned". (Same as ci.yml.)
      - name: Enforce pinned NDK (drop preinstalled)
        run: |
          echo "NDKs before:"
          ls "${ANDROID_HOME}/ndk" || true
          for d in "${ANDROID_HOME}"/ndk/*; do
            if [ "$(basename "$d")" != "${NDK_VERSION}" ]; then
              echo "removing $d"
              rm -rf "$d"
            fi
          done
          echo "NDKs after:"
          ls "${ANDROID_HOME}/ndk"
          test -d "${ANDROID_HOME}/ndk/${NDK_VERSION}"

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      # Rust targets come from rust-toolchain.toml (rustup auto-installs
      # listed targets) — no manual `rustup target add` step.

      - name: Install wasm-pack
        uses: taiki-e/install-action@ab6895351a88b908e96a4697860d4ffea5e57dbe # v2.87.27
        with:
          tool: wasm-pack

      - name: Build web-compatible vault codec
        run: npm run build:wasm:pkg

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true

      # Same as ci.yml: persist the ONNX Runtime dfbin dir outside `target/`.
      - name: Cache ONNX Runtime prebuilt binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ort
          key: ort-dfbin-${{ runner.os }}-aarch64-v1
          restore-keys: |
            ort-dfbin-${{ runner.os }}-aarch64-

      # Same as ci.yml: self-healing warm-cache poison (see comment there).
      # NB: plain `cargo clean -p` misses the Android target dirs — remove
      # the fingerprint/output dirs directly. Also drop a partial dfbin dir:
      # ort-sys skips the download when the dir exists even with the lib
      # missing, which then fails the link with `could not find native
      # static library onnxruntime`.
      - name: Force ort-sys rebuild when its binaries are missing
        run: |
          ORT_DFBIN="$HOME/.cache/ort/dfbin/aarch64-linux-android"
          if ! ls "$ORT_DFBIN/"*/libonnxruntime.a >/dev/null 2>&1; then
            echo "onnxruntime.a absent — dropping cached ort-sys state + partial dfbin so download-binaries re-runs fresh"
            rm -rf "$ORT_DFBIN"
            # NB: the trailing `*` must stay UNQUOTED — a quoted glob never
            # expands, so `rm -rf "dir/ort-sys-*"` silently removes nothing
            # (CI 2026-10-08: self-heal no-op → stale build-script output →
            # `could not find native static library onnxruntime`).
            for triple in aarch64-linux-android x86_64-linux-android; do
              rm -rf target/"$triple"/release/build/ort-sys-* target/"$triple"/release/.fingerprint/ort-sys-*
            done
            rm -rf target/release/build/ort-sys-* target/release/.fingerprint/ort-sys-*
          else
            echo "onnxruntime.a present — incremental build is safe"
          fi
          echo "ORT cache contents:"
          find "$HOME/.cache/ort" -maxdepth 4 2>/dev/null | head -50 || echo "(empty)"

      - name: Initialize Android project
        run: npm run tauri android init
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}

      # Same as ci.yml: `tauri android init` stamps the template's DEFAULT
      # launcher icons — sync the real mark before building the release APK.
      - name: Sync Android launcher icons
        run: bash scripts/android-icons.sh

      # In-tree Android settings `tauri android init` does not generate:
      # versionCode audit, manifest permissions/cleartext/backup/intents.
      - name: Configure Android project
        run: bash scripts/android-configure.sh

      # `:buildSrc` kotlin-dsl artifacts resolve through pluginManagement
      # (plugin portal only in the generated project) — harden to
      # mavenCentral()/google() + retries. (Same as ci.yml.)
      - name: Harden Gradle repositories
        run: bash scripts/android-gradle-harden.sh

      # A release APK must be installable, so a missing keystore is a hard
      # failure here (REQUIRE_SIGNING) rather than a warning.
      - name: Configure Android release signing
        run: bash scripts/android-signing.sh prepare
        env:
          REQUIRE_SIGNING: "1"
          ANDROID_KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build Android APK
        # ort-sys ships prebuilt ONNX Runtime only for aarch64-linux-android on
        # Android; the other Rust ABIs have no dist entry, so build arm64-v8a.
        # --apk --aab: Play upload bundle alongside the direct-install APK;
        # --split-per-abi keeps the arm64-only payload explicit in the name.
        run: npx tauri android build --target aarch64 --apk --aab --split-per-abi
        env:
          ANDROID_NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify Android APK signature
        run: bash scripts/android-signing.sh verify
        env:
          REQUIRE_SIGNING: "1"

      # Shred keystore + signing properties before archiving so runner
      # images / debug bundles never retain plaintext signing secrets.
      # `if: always()`: a failed build/verify must shred too, not leave the
      # decoded keystore on the runner.
      - name: Shred Android signing secrets
        if: always()
        run: bash scripts/android-signing.sh cleanup

      - name: Upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: |
            src-tauri/gen/android/app/build/outputs/apk/**/*.apk
            src-tauri/gen/android/app/build/outputs/bundle/**/*.aab
          retention-days: 30
          if-no-files-found: error

  # ─── iOS: unsigned device IPA ─────────────────────────────────────
  # Mirrors ci.yml: build the arm64 device target and verify that it remains
  # unsigned. Users must sign it with their Apple profile before installation.
  ios-build:
    name: Build iOS (unsigned device IPA)
    runs-on: macos-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Cache Rust build artifacts
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: "."
          cache-on-failure: true

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Initialize iOS project
        run: npm run tauri ios init

      - name: Configure iOS project
        run: bash scripts/ios-configure.sh

      - name: Build unsigned iOS device IPA
        run: npx tauri ios build --ci --target aarch64 --no-sign
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify unsigned iOS device IPA
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          IPA_CANDIDATES=(src-tauri/gen/apple/build/arm64/*.ipa)
          if [ "${#IPA_CANDIDATES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one device IPA under src-tauri/gen/apple/build/arm64; found ${#IPA_CANDIDATES[@]}"
            exit 1
          fi
          VERSION="$(node -p "require('./package.json').version")"
          mkdir -p dist-ios-device-unsigned
          IPA_PATH="dist-ios-device-unsigned/CyberManju-OS-${VERSION}-ios-device-unsigned.ipa"
          mv "${IPA_CANDIDATES[0]}" "$IPA_PATH"
          test -s "$IPA_PATH"
          python3 - "$IPA_PATH" <<'PY'
          import sys
          from zipfile import ZipFile

          path = sys.argv[1]
          with ZipFile(path) as ipa:
              names = ipa.namelist()
              app_plists = [name for name in names if name.startswith("Payload/") and name.endswith(".app/Info.plist")]
              assert len(app_plists) == 1, f"expected one Payload app Info.plist, found {len(app_plists)}"
              assert not any(name.endswith("embedded.mobileprovision") for name in names), "unexpected provisioning profile in unsigned IPA"
          print(f"verified IPA container and unsigned profile state: {path}")
          PY
          VERIFY_DIR="$RUNNER_TEMP/ios-device-ipa-inspect"
          mkdir -p "$VERIFY_DIR"
          unzip -q "$IPA_PATH" -d "$VERIFY_DIR"
          APPS=("$VERIFY_DIR"/Payload/*.app)
          if [ "${#APPS[@]}" -ne 1 ]; then
            echo "::error::expected one device app in IPA; found ${#APPS[@]}"
            exit 1
          fi
          APP_PATH="${APPS[0]}"
          EXECUTABLE="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")"
          BINARY_PATH="$APP_PATH/$EXECUTABLE"
          test -s "$BINARY_PATH"
          ARCHS="$(xcrun lipo -archs "$BINARY_PATH")"
          echo "IPA binary architectures: $ARCHS"
          case " $ARCHS " in
            *" arm64 "*) ;;
            *) echo "::error::device IPA must contain arm64; got $ARCHS"; exit 1 ;;
          esac
          PLATFORM="$(xcrun otool -l "$BINARY_PATH" | awk '
            $1 == "cmd" { in_build_version = ($2 == "LC_BUILD_VERSION"); next }
            in_build_version && $1 == "platform" { print $2; exit }
          ')"
          echo "IPA Mach-O platform: $PLATFORM (2=IOS device; 7=IOSSIMULATOR)"
          if [ "$PLATFORM" != "2" ]; then
            echo "::error::IPA executable is not built for iOS device platform 2 (IOSSIMULATOR is 7)"
            exit 1
          fi
          SIGNATURE_LOG="$RUNNER_TEMP/ios-device-codesign-check.log"
          if codesign -dv --verbose=4 "$APP_PATH" >"$SIGNATURE_LOG" 2>&1; then
            echo "::error::expected an unsigned IPA but the app bundle has a code signature"
            cat "$SIGNATURE_LOG"
            exit 1
          fi
          if ! grep -Fqi 'code object is not signed at all' "$SIGNATURE_LOG"; then
            echo "::error::could not confirm that the device app is unsigned"
            cat "$SIGNATURE_LOG"
            exit 1
          fi
          echo "verified unsigned iOS device IPA: $IPA_PATH"

      - name: Upload iOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: dist-ios-device-unsigned/*.ipa
          retention-days: 30
          if-no-files-found: error

  # ─── Go: universal `cyb` CLI (Charm UI) ──────────────────────────
  # Pure Go (no cgo): one runner cross-compiles desktop and Termux targets.
  # Deliberately waits on nothing (no downloads from other jobs).
  cli-build:
    name: Build CLI (cyb)
    runs-on: ubuntu-latest
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: cli/go.mod
          cache-dependency-path: cli/go.sum

      - name: Check formatting
        working-directory: cli
        run: test -z "$(gofmt -l .)"

      - name: Run vet + tests
        working-directory: cli
        run: |
          go vet ./...
          go test -race -count=1 ./...

      - name: Cross-compile cyb (desktop amd64/arm64; Android/Termux arm64)
        working-directory: cli
        env:
          CGO_ENABLED: "0"
          # Same OAuth broker secrets used by WASM, Android and iOS builds;
          # bake them into every cyb target so `supa login` works directly.
          # Empty when unset — the user can paste the pair from Settings.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          PKG_VER="$(node -p "require('../package.json').version")"
          mkdir -p dist-cli
          for target in "linux amd64" "linux arm64" "darwin amd64" "darwin arm64" "windows amd64" "windows arm64" "android arm64"; do
            set -- $target
            bin="cyb"
            [ "$1" = "windows" ] && bin="cyb.exe"
            CGO_ENABLED=0 GOOS="$1" GOARCH="$2" go build -trimpath \
              -ldflags "-s -w -X main.version=v$PKG_VER -X main.commit=$GITHUB_SHA -X github.com/cybermanju/cybermanju.github.io/cli/internal/supa.BakedURL=$VITE_SUPABASE_URL -X github.com/cybermanju/cybermanju.github.io/cli/internal/supa.BakedKey=$VITE_SUPABASE_ANON_KEY" \
              -o "build-$1-$2/$bin" .
            tar -czf "dist-cli/cyb-$1-$2.tar.gz" -C "build-$1-$2" "$bin"
          done
          ls -la dist-cli/

      - name: Build .debs (linux amd64/arm64)
        working-directory: cli
        run: bash ../scripts/cyb-deb.sh "$(node -p "require('../package.json').version")" . dist-cli

      - name: Upload CLI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: cli/dist-cli/
          retention-days: 30
          if-no-files-found: error

  # ─── Docker: Build & Publish to GHCR ──────────────────────────────
  docker-build:
    name: Docker Build & Publish
    runs-on: ubuntu-latest
    # Independent of the lint gate (create-release still requires
    # rust-check) — builds in parallel with everything else.
    needs: resolve
    if: github.event_name != 'workflow_dispatch' || github.event.inputs.reuse_run_id == ''
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Resolve image name
        id: image
        # GHCR requires a lowercase repository path.
        run: |
          owner=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "name=ghcr.io/${owner}/cybermanju-os" >> "$GITHUB_OUTPUT"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.resolve.outputs.tag }}
            ${{ steps.image.outputs.name }}:latest
          # Scoped GHA cache (see ci.yml) — keeps layer blobs out of the
          # rust-cache quota slot.
          cache-from: type=gha,scope=cybermanju-docker
          cache-to: type=gha,mode=max,scope=cybermanju-docker
          # OAuth broker (public URL + anon key) baked into the served
          # bundle. Empty when unset — the app then takes the Settings paste.
          build-args: |
            VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Verify published image
        run: docker pull "${{ steps.image.outputs.name }}:latest"

  # ─── Reuse: ship a previous green CI build, zero compilation ─────
  # Runs ONLY in reuse mode (workflow_dispatch + reuse_run_id). Downloads
  # the CI run's dist-* artifacts and re-uploads them under the release-*
  # names the build jobs would have produced, so `create-release` below is
  # byte-identical in both modes. No checkout of source, no compilation.
  fetch-last-build:
    name: Fetch last CI build (no rebuild)
    runs-on: ubuntu-latest
    needs: resolve
    if: github.event_name == 'workflow_dispatch' && github.event.inputs.reuse_run_id != ''
    permissions:
      contents: read
      actions: read
    env:
      RUN_ID: ${{ needs.resolve.outputs.reuse_run_id }}
      # No checkout in this job, so gh cannot infer the repo from git remotes.
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Download dist-* artifacts of the CI run
        run: |
          pairs="dist-windows:release-windows dist-linux:release-linux dist-linux-deb:release-linux-deb dist-linux-rpm:release-linux-rpm dist-rpm:release-rpm dist-flatpak:release-flatpak dist-arch:release-arch dist-macos:release-macos dist-android:release-android dist-ios-device-unsigned:release-ios dist-wasm:dist-wasm dist-cli:release-cli"
          mkdir -p artifacts
          for pair in $pairs; do
            src="${pair%%:*}"; dst="${pair##*:}"
            echo "--- $src → artifacts/$dst ---"
            gh run download "$RUN_ID" -n "$src" -D "artifacts/$dst"
          done
          echo "downloaded:"
          find artifacts -type f | sort
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Fail early when a release family is missing
        run: |
          missing=0
          need() {
            if ! find "artifacts/$1" -name "$2" -print -quit | grep -q .; then
              echo "::error::CI run $RUN_ID artifact '$1' contains no $2 (expired or never built?)"
              missing=1
            fi
          }
          need release-windows '*.exe'
          need release-windows '*.msi'
          need release-linux '*.deb'
          need release-linux '*.AppImage'
          need release-rpm '*.rpm'
          need release-flatpak '*.flatpak'
          need release-arch '*.AppImage'
          need release-macos '*.dmg'
          need release-android '*.apk'
          need release-android '*.aab'
          need release-ios '*.ipa'
          need release-cli 'cyb-*.tar.gz'
          need release-cli 'cyb_*.deb'
          need dist-wasm 'index.html'
          exit $missing

      - name: Re-upload Windows artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-windows
          path: artifacts/release-windows/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload Linux artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux
          path: artifacts/release-linux/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload Debian package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-deb
          path: artifacts/release-linux-deb/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload RPM source package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-linux-rpm
          path: artifacts/release-linux-rpm/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload RPM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-rpm
          path: artifacts/release-rpm/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload Flatpak artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-flatpak
          path: artifacts/release-flatpak/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload Arch artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-arch
          path: artifacts/release-arch/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload macOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-macos
          path: artifacts/release-macos/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload Android artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-android
          path: artifacts/release-android/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload iOS artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-ios
          path: artifacts/release-ios/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload CLI artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-cli
          path: artifacts/release-cli/
          retention-days: 30
          if-no-files-found: error

      - name: Re-upload WASM artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-wasm
          path: artifacts/dist-wasm/
          retention-days: 30
          if-no-files-found: error

  # ─── Create GitHub Release ───────────────────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    # Fan-in over two mutually exclusive modes: in each mode half the needs
    # above are skipped, and a skipped need skips its dependents by default.
    # Run unless something actually failed or was cancelled instead.
    if: ${{ !cancelled() && !failure() }}
    needs:
      - resolve
      - rust-check
      - wasm-build
      - windows-build
      - linux-build
      - flatpak-build
      - arch-build
      - macos-build
      - android-build
      - ios-build
      - cli-build
      - docker-build
      - fetch-last-build
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts/
          merge-multiple: false
          # Skip Buildx provenance blobs (e.g. `repo~...dockerbuild`): their
          # blob downloads flake and one bad blob fails the whole step, while
          # nothing downstream needs them — only the release families below.
          pattern: '{release-*,dist-wasm}'

      - name: List downloaded artifacts
        run: find artifacts/ -type f | head -100

      # A job can go green while producing nothing (an upload with the default
      # `warn` policy). Fail here instead of shipping a release with a hole.
      - name: Check every release format is present
        run: |
          missing=0
          check() {
            local dir="$1"; shift
            if [ ! -d "artifacts/$dir" ]; then
              echo "::error::artifact '$dir' was not produced"
              missing=1
              return
            fi
            local pat
            for pat in "$@"; do
              if ! find "artifacts/$dir" -name "$pat" -print -quit | grep -q .; then
                echo "::error::artifact '$dir' contains no $pat"
                missing=1
              fi
            done
          }
          check release-windows  "*.exe" "*.msi"
          check release-linux    "*.deb" "*.AppImage"
          check release-rpm      "*.rpm"
          check release-flatpak  "*.flatpak"
          check release-arch     "*.AppImage"
          check release-macos    "*.dmg"
          check release-android  "*.apk" "*.aab"
          check release-ios      "*.ipa"
          check release-cli      "cyb-*.tar.gz" "cyb_*.deb"
          check dist-wasm        "index.html"
          exit $missing

      - name: Generate release notes
        id: notes
        env:
          CUSTOM_NOTES: ${{ inputs.notes }}
        run: |
          CURRENT_TAG="${{ needs.resolve.outputs.tag }}"
          # Previous tag = newest tag other than the one being released.
          PREV_TAG=$(git tag --sort=-creatordate | grep -vx "$CURRENT_TAG" | head -1 || true)
          # Published image name — must match the docker-build job above.
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE="ghcr.io/${OWNER}/cybermanju-os"
          
          # Release body policy: features description + direct downloads only.
          # No generated commit list — the log below used to dump every commit
          # subject into the release notes; the feature atlas is the body.
          echo "" > release_notes.md
          # Custom notes from a manual dispatch (push.sh --release -m "...")
          # lead; the feature atlas follows in both modes.
          if [ -n "${CUSTOM_NOTES:-}" ]; then
            printf '%s\n\n' "$CUSTOM_NOTES" >> release_notes.md
          fi
          # Feature atlas + status live in docs/RELEASE_NOTES.md (single source
          # shared with the GitLab mirror).
          cat docs/RELEASE_NOTES.md >> release_notes.md
          echo "" >> release_notes.md
          echo "## Downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo "| Platform | File |" >> release_notes.md
          echo "|----------|------|" >> release_notes.md
          echo "| Windows | \`.exe\` / \`.msi\` installers, straight off the release |" >> release_notes.md
          echo "| Linux | \`.deb\` + \`.AppImage\`, straight off the release |" >> release_notes.md
          echo "| Linux (RPM) | \`.rpm\` for Fedora/RHEL |" >> release_notes.md
          echo "| Linux (Flatpak) | \`.flatpak\` (Universal Linux) |" >> release_notes.md
          echo "| Linux (Arch) | \`*-arch.deb\` / \`*-arch.AppImage\` built on Arch |" >> release_notes.md
          echo "| macOS | \`.dmg\` (app inside) |" >> release_notes.md
          echo "| Android | signed \`.apk\` (arm64-v8a) + \`.aab\` (Play upload) |" >> release_notes.md
          echo "| iOS | unsigned arm64 device \`.ipa\` (sign before installation) |" >> release_notes.md
          echo "| Terminal | \`cyb-*.tar.gz\` universal CLI (\`curl -fsSL https://cybermanju.github.io/install.sh \| bash\`) |" >> release_notes.md
          echo "| Web (WASM) | \`dist-wasm.zip\` (static files for any web server) |" >> release_notes.md
          echo "| Docker | \`docker pull ${IMAGE}:latest\` |" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Docker" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "# LAN-only by default; publish on your NAS address with -p 192.168.x.x:3456:3456" >> release_notes.md
          echo "docker run -d -p 127.0.0.1:3456:3456 -v /DATA/AppData/cybermanju-os/config:/data ${IMAGE}:latest" >> release_notes.md
          echo '```' >> release_notes.md
          echo "" >> release_notes.md
          echo "## Installation" >> release_notes.md
          echo "" >> release_notes.md
          echo "- **Windows**: Download and run the \`.exe\` installer" >> release_notes.md
          echo "- **Linux (Debian/Ubuntu)**: Install the \`.deb\` package" >> release_notes.md
          echo "- **Linux (Fedora/RHEL)**: Install the \`.rpm\` package" >> release_notes.md
          echo "- **Linux (Flatpak)**: \`flatpak install cybermanju-os.flatpak\`" >> release_notes.md
          echo "- **Linux (Arch/CachyOS)**: Run the \`.AppImage\` or build from AUR" >> release_notes.md
          echo "- **macOS**: Open the \`.dmg\` and drag to Applications" >> release_notes.md
          echo "- **Android**: Enable unknown sources, install the \`.apk\` (arm64-v8a devices only)" >> release_notes.md
          echo "- **iOS**: Sign the unsigned arm64 device \`.ipa\` with your Apple certificate and provisioning profile before installation" >> release_notes.md
          echo "- **Web**: Extract \`.zip\` and serve with any static file server" >> release_notes.md
          echo "" >> release_notes.md
          echo "### Verify downloads" >> release_notes.md
          echo "" >> release_notes.md
          echo '```bash' >> release_notes.md
          echo "sha256sum -c SHA256SUMS.txt" >> release_notes.md
          echo '```' >> release_notes.md

      - name: Package artifacts
        run: |
          mkdir -p packages

          # Native installers ship as themselves (no zips): GitHub Release
          # assets are a flat file list, so each family lands unpacked.
          # Arch files take an `-arch` stem — the Arch container rebuilds the
          # same Tauri bundle names as the Ubuntu job, so bare copies would
          # clobber each other. macOS `.app` dirs are skipped on purpose: the
          # app ships inside the `.dmg`.
          copy_files() {
            src="$1"; suffix="$2"; shift 2
            [ -d "$src" ] || return 0
            for pat in "$@"; do
              while IFS= read -r -d '' f; do
                base=$(basename "$f")
                if [ -n "$suffix" ]; then
                  stem="${base%.*}"; ext="${base##*.}"
                  base="${stem}${suffix}.${ext}"
                fi
                cp "$f" "packages/$base"
              done < <(find "$src" -type f -name "$pat" -print0)
            done
          }

          copy_files artifacts/release-windows "" '*.exe' '*.msi'
          copy_files artifacts/release-linux "" '*.deb' '*.AppImage'
          copy_files artifacts/release-rpm "" '*.rpm'
          copy_files artifacts/release-flatpak "" '*.flatpak'
          copy_files artifacts/release-arch "-arch" '*.deb' '*.AppImage'
          copy_files artifacts/release-macos "" '*.dmg'
          copy_files artifacts/release-android "" '*.apk' '*.aab'
          copy_files artifacts/release-ios "" '*.ipa'
          copy_files artifacts/release-cli "" 'cyb-*.tar.gz'
          copy_files artifacts/release-cli "" 'cyb_*.deb'

          # Web stays a zip: it is a directory tree (index.html + assets),
          # not a single installable file.
          if [ -d "artifacts/dist-wasm" ]; then
            (cd artifacts/dist-wasm && zip -r ../../packages/dist-wasm.zip .)
          fi

          # List all packages
          ls -la packages/

      - name: Generate checksums
        run: |
          (cd packages && sha256sum * > SHA256SUMS.txt)
          cat packages/SHA256SUMS.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ needs.resolve.outputs.tag }}
          name: "CyberManju OS ${{ needs.resolve.outputs.tag }}"
          body_path: release_notes.md
          draft: false
          prerelease: false
          files: packages/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
