    .frame{fill:#ffffff;fill-opacity:.55;stroke:#d0d7de;stroke-dasharray:6 4}
    .sys{fill:#ffffff;stroke:#d0d7de}
    .svc{fill:#ddf4ff;stroke:#54aeff}
    .app{fill:#fbefff;stroke:#c297ff}
    .win{fill:#fff8c5;stroke:#d4a72c}
    .ui{fill:#dafbe1;stroke:#4ac26b}
    .ext{fill:#f6f8fa;stroke:#8c959f;stroke-dasharray:5 4}
    .t{fill:#1f2328;font:600 13px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .g{fill:#1f2328;font:600 14px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .h{fill:#656d76;font:600 11px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;letter-spacing:.8px}
    .s{fill:#656d76;font:11px ui-monospace,SFMono-Regular,"SF Mono",Menlo,Consolas,"Liberation Mono",monospace}
    .lbl{fill:#656d76;font:italic 10.5px -apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
    .edge{fill:none;stroke:#8c959f;stroke-width:1.5}
    .cmd{fill:none;stroke:#fb8f44;stroke-width:1.5;stroke-dasharray:5 4}
    .head{fill:#8c959f}
    .head-c{fill:#fb8f44}
    @media (prefers-color-scheme: dark){
      .bg{fill:#0d1117}
      .frame{fill:#161b22;fill-opacity:.5;stroke:#30363d}
      .sys{fill:#161b22;stroke:#30363d}
      .svc{fill:#0c2d6b;stroke:#1f6feb}
      .app{fill:#271052;stroke:#8957e5}
      .win{fill:#3b2300;stroke:#9e6a03}
      .ui{fill:#033a16;stroke:#2ea043}
      .ext{fill:#0d1117;stroke:#6e7681}
      .t,.g{fill:#e6edf3}
      .h,.s,.lbl{fill:#8b949e}
      .edge{stroke:#6e7681}
      .cmd{stroke:#db6d28}
      .head{fill:#6e7681}
      .head-c{fill:#db6d28}
    }
  </style>
