<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="924" viewBox="0 0 1520 924" role="img" aria-labelledby="title desc">
<!--
  GPUi Shell: architecture overview. Hand-maintained SVG, written by Claude; agents keep it
  in sync (see AGENTS.md), but plain edits on the grid below work just as well.

  Source of truth: crates/*/Cargo.toml (who depends on whom), crates/services/src/lib.rs
  (the services), crates/app/src/main.rs (what boots) and every `cx.open_window` call
  (the windows). A service or window added or removed there gets a box added or removed
  here, in the same PR.

  Layout (viewBox 1520 x 924, columns left to right):
    x   24–244   OUTSIDE THE PROCESS   rows y 100 / 212 / 292 / 388 / 484 / 596
    x  268–620   crates/services       frame y 84–476; boxes x 284–604 on the same rows
    x  660–1132  crates/app            frame y 84–676
                   x 676–872   glue    AppState, watch, panel.rs, keybinds, Config, ipc
                   x 882       signal bus feeding every window
                   x 892–1116  windows Bar, Dock, Panels, Launcher, OSD, popups
    x 1164–1496  crates/ui + assets    frame y 84–676
    y  708–900   INSIDE EVERY SERVICE  the lifecycle loop, left to right

  CSS classes:
    .bg   background         .frame dashed crate frame   .h    column header
    .t    box title          .s     detail (monospace)   .g    frame title
    .lbl  edge label
    .sys  outside the process (white)   .svc service (blue)      .app app glue (purple)
    .win  layer-shell window (yellow)   .ui  ui / assets (green) .ext dev-only (dashed grey)
    .edge data / events (grey)          .cmd command (dashed orange)
  Colours are literal hex on purpose: some viewers can't resolve var().
-->
  <title id="title">GPUi Shell architecture</title>
  <desc id="desc">One process. crates/services talks to everything outside it: D-Bus daemons, compositor IPC, PulseAudio, PipeWire, udev and desktop files, each through a service that holds its state in a Mutable. crates/app holds every service in the AppState global; state::watch turns their signals into re-renders of the layer-shell windows: per-display bar and dock, panels, launcher, OSD and notification popups. Windows send commands back with dispatch. Config and theme files are hot-reloaded with inotify, and a second gpuishell invocation reaches the running one through a unix socket. crates/ui provides the components, shell patterns and theme the windows render with; crates/assets the icons; crates/story is a dev-only gallery.</desc>
